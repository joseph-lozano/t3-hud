name: Build signed DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (three numbers, e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      T3HUD_VERSION: ${{ inputs.version }}
      T3HUD_BUILD_NUMBER: ${{ github.run_number }}
      T3HUD_ARCH: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate version and required secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          [[ "$T3HUD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Version must look like 0.1.0.' >&2; exit 1; }
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing secret: $name" >&2; exit 1; }
          done

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/t3hud-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/.* ([A-Fa-f0-9]{40}) "Developer ID Application:.*$/\1/p')"
          [[ "$identity" =~ ^[A-Fa-f0-9]{40}$ ]] || { echo 'Export exactly one valid Developer ID Application identity.' >&2; exit 1; }
          echo "T3HUD_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build Apple Silicon signed app
        run: |
          ./scripts/build
          lipo -verify_arch arm64 'dist/T3 HUD.app/Contents/MacOS/T3HUD'

      - name: Create signed DMG
        run: ./scripts/package-dmg

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="dist/T3-HUD-$T3HUD_VERSION.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notarization.json"
          cat "$RUNNER_TEMP/notarization.json"
          python3 - "$RUNNER_TEMP/notarization.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          if result.get('status') != 'Accepted':
              sys.exit('Notarization was not accepted. See the submission ID in the result.')
          PY
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --strict "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          (cd dist && shasum -a 256 "T3-HUD-$T3HUD_VERSION.dmg" > "T3-HUD-$T3HUD_VERSION.dmg.sha256")

      - name: Upload DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: T3-HUD-${{ inputs.version }}-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/t3hud-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/t3hud-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
